<main aria-hidden="false" class="profile-shell flex-grow-1"
      id="profile">
    <img alt="" class="profile-backdrop" decoding="async" width="1000" height="640"
         src="{{ '/assets/images/publication-preview.svg' | relative_url }}?v={{ site.data.release.version | escape }}">
    <div class="card px-0">
        <img alt="A headshot of {{ site.author | escape }}" class="card-img-top"
             decoding="async" height="600" src="{{ site.headshot | relative_url }}" width="600">
        <div class="card-body">
            <h1 class="card-title h5 text-center mb-1">{{ site.author | escape }}</h1>
            <p class="card-subtitle h6 mb-1 text-muted text-center">
                <a href="{{ site.cmu_profile | escape }}">{{ site.affiliation_label | escape }}</a>
            </p>
            <div class="card-text profile-bio text-center mb-2">
                {{ include.bio }}
            </div>

            <div aria-label="Contact and profile links" class="btn-group d-flex" role="group">
                <a aria-label="Email" class="btn btn-outline-dark" href="mailto:{{ site.email }}">
                    <svg aria-hidden="true" class="icon" viewBox="0 0 512 512"><path d="M48 64c-26.5 0-48 21.5-48 48 0 15.1 7.1 29.3 19.2 38.4l208 156c17.1 12.8 40.5 12.8 57.6 0l208-156c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48L48 64zM0 196L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-188-198.4 148.8c-34.1 25.6-81.1 25.6-115.2 0L0 196z"/></svg>
                </a>
                <a aria-label="LinkedIn" class="btn btn-outline-dark rounded-0"
                   href="https://www.linkedin.com/in/{{ site.linkedin }}">
                    <svg aria-hidden="true" class="icon linkedin-icon" viewBox="0 0 448 512"><path d="M416 32H31.9C14.3 32 0 46.5 0 64.3v383.4C0 465.5 14.3 480 31.9 480H416c17.6 0 32-14.5 32-32.3V64.3C448 46.5 433.6 32 416 32zM135.4 416H69V202.2h66.5V416zM102.2 173c-21.3 0-38.5-17.3-38.5-38.5S80.9 96 102.2 96c21.2 0 38.5 17.3 38.5 38.5 0 21.3-17.2 38.5-38.5 38.5zM384.3 416h-66.4V312c0-24.8-.5-56.7-34.5-56.7-34.6 0-39.9 27-39.9 54.9V416h-66.4V202.2h63.7v29.2h.9c8.9-16.8 30.6-34.5 62.9-34.5 67.2 0 79.7 44.3 79.7 101.9V416z"/></svg>
                </a>
                <a aria-label="GitHub" class="btn btn-outline-dark rounded-0"
                   href="https://github.com/{{ site.github }}">
                    <svg aria-hidden="true" class="icon" viewBox="0 0 512 512"><path d="M216.5 362.5c-66-8-112.5-55.5-112.5-117 0-25 9-52 24-70-6.5-16.5-5.5-51.5 2-66 20-2.5 47 8 63 22.5 19-6 39-9 63.5-9s44.5 3 62.5 8.5c15.5-14 43-24.5 63-22 7 13.5 8 48.5 1.5 65.5 16 19 24.5 44.5 24.5 70.5 0 61.5-46.5 108-113.5 116.5 17 11 28.5 35 28.5 62.5l0 52C323 491.5 335.5 500 350.5 494 441 459.5 512 369 512 257 512 115.5 397 0 255.5 0S0 115.5 0 257c0 111 70.5 203 165.5 237.5 13.5 5 26.5-4 26.5-17.5l0-40c-7 3-16 5-24 5-33 0-52.5-18-66.5-51.5-5.5-13.5-11.5-21.5-23-23-6-.5-8-3-8-6 0-6 10-10.5 20-10.5 14.5 0 27 9 40 27.5 10 14.5 20.5 21 33 21s20.5-4.5 32-16c8.5-8.5 15-16 21-21z"/></svg>
                </a>
                <a aria-label="Google Scholar" class="btn btn-outline-dark"
                   href="https://scholar.google.com/citations?user={{ site.google_scholar }}&amp;hl=en">
                    <svg aria-hidden="true" class="icon" viewBox="0 0 512 512"><path d="M390.9 298.5s0 .1 .1 .1c9.2 19.4 14.4 41.1 14.4 64-.1 82.5-66.9 149.4-149.4 149.4S106.7 445.1 106.7 362.7c0-22.9 5.2-44.6 14.4-64 1.7-3.6 3.6-7.2 5.6-10.7 4.4-7.6 9.4-14.7 15-21.3 27.4-32.6 68.5-53.3 114.4-53.3 33.6 0 64.6 11.1 89.6 29.9 9.1 6.9 17.4 14.7 24.8 23.5 5.6 6.6 10.6 13.8 15 21.3 2 3.4 3.8 7 5.5 10.5l-.1-.1zm26.4-18.8c-30.1-58.4-91-98.4-161.3-98.4s-131.2 40-161.3 98.4l-94.7-77 256-202.7 256 202.7-94.7 77.1 0-.1z"/></svg>
                </a>
                <a aria-label="CV — Curriculum vitae (PDF)" class="btn btn-outline-dark"
                   href="{{ site.cv_pdf | relative_url }}" rel="noopener noreferrer" target="_blank">
                    <span aria-hidden="true" class="cv-icon">CV</span>
                </a>
            </div>
            <a aria-controls="graph-container" aria-expanded="false"
               class="btn btn-outline-dark w-100 explore-button"
               href="?view=list" id="exit">
                <span>Explore publications</span>
            </a>
            <noscript><p class="mt-2 mb-0 text-center"><a href="https://scholar.google.com/citations?user={{ site.google_scholar }}&amp;hl=en">Browse publications on Google Scholar</a> (interactive views require JavaScript).</p></noscript>
        </div>
    </div>
    <aside aria-labelledby="recent-publications-title" class="card recent-publications"
           data-src="{{ '/assets/json/recent-publications.json' | relative_url }}?v={{ site.data.release.version | escape }}"
           hidden id="recent-publications">
        <div class="card-body">
            <h2 class="card-title h5 text-center" id="recent-publications-title">Recent publications</h2>
            <ul class="recent-publications-list list-unstyled mb-0" role="list"></ul>
        </div>
    </aside>
</main>
